name: Publicar prévia do Radar Saúde

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Preparar os arquivos da prévia
        run: |
          mkdir -p _site
          cp -- index.html site.css site.js previa.json _site/
          grep -q 'id="login"' _site/index.html
          jq -e '.version == 1 and (.data | length > 0)' _site/previa.json > /dev/null
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
